<!-- Optional: Import a nice font like Inter from Google Fonts if you plan to host this elsewhere.
     However, the system fonts provided below will work great everywhere. -->
<style>
:root{
  --bg:#050505;--panel:#101010;--line:rgba(255,255,255,.07);
  --text:#fff;--muted:#b0b0b0;--gold:#f4c95d;--gold2:#b98622;
  --panel-radius:24px; --icon-radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background: 
    linear-gradient(135deg, rgba(244,201,93,.02) 0%, transparent 40%),
    #050505;
  overflow-x:hidden;
}

/* Base style for the container to keep things centered and neat */
.wrap{width:min(580px,100%);margin:auto;padding:28px 16px 40px;position:relative}

/* --- Professional Header & Profile Section --- */
.hero{text-align:center;padding:10px 0 30px; border-bottom:1px solid var(--line); margin-bottom:30px;}
.profile-wrapper { position: relative; display: inline-block; }
.photo {
  width: 130px; height: 130px; margin: 0 auto;
  border-radius: 50%;
  border: 4px solid #fff;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  background: #222 url('image_0.png') no-repeat center center;
  background-size: cover; /* Adjust this if the face needs better cropping */
  transform: translateY(10px);
}
.verified-badge {
  position: absolute; bottom: 5px; right: 5px;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--gold); border: 3px solid #fff;
  color: #000; font-size: 18px; display: grid; place-items: center; font-weight: 900;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

h1.user-name { font-size: 46px; line-height: 1.1; margin: 15px 0 2px; letter-spacing: -2px; font-weight: 850; color: #fff; }
.brand { margin: 0 0 10px; color: var(--gold); font-size: 16px; font-weight: 700; letter-spacing: 0.5px; opacity: 0.9; }
.tag{margin:0;color:var(--muted);font-weight:400;font-size:14px;}

/* --- Professional Social Links Section --- */
.links{display:grid;gap:15px;}
.social{
  position:relative;display:flex;align-items:center;gap:18px;text-decoration:none;color:#fff;
  padding:18px 20px; border-radius: var(--panel-radius);
  background: #111;
  border: 1px solid var(--line);
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  transition: all .25s ease;
  overflow:hidden;
}

/* Subtle border hover effect */
.social:hover{
  border-color: rgba(244,201,93,.4);
  background: #141414;
  transform: translateY(-2px);
  box-shadow: 0 12px 35px rgba(0,0,0,0.25);
}

.icon{
  width:52px;height:52px; border-radius: var(--icon-radius);
  display:grid;place-items:center;font-size:24px;
  background:#1a1a1a;
  border:1px solid rgba(255,255,255,.05);
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.02);
}

.info{text-align:left; flex:1}
.info b{display:block;font-size:18px; font-weight: 700; letter-spacing: -0.5px;}
.info small{color:var(--muted);font-size:13px;margin-top:2px;display:block}

.arrow{font-size:24px;color:#555; transition: color 0.2s;}
.social:hover .arrow { color: var(--gold); }

/* --- Footer Section --- */
.footer{
  text-align:center;margin-top:50px; padding-top:25px;
  color:#666;font-size:12px; border-top: 1px solid var(--line);
}
.footer b{color:#aaa}
.footer .made-by { color: var(--gold); font-weight: 700; }

/* Responsive adjustments */
@media(max-width:480px){
  .wrap { padding-top: 20px; }
  h1.user-name { font-size: 38px; }
  .photo { width: 110px; height: 110px; }
  .social { padding: 16px 18px; gap: 15px; }
  .icon { width: 48px; height: 48px; font-size: 22px; }
  .info b { font-size: 17px; }
}
</style>
</head>
